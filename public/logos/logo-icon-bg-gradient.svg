  <path d="M 122 412 L 358 412 Q 412 412 412 358" stroke="#00E5C0" stroke-width="32" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="412" cy="296" r="22" fill="#00E5C0"/>
