<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafeto — Demo portátil</title>
</head>
<body>
<style>
  :root {
    --fondo: #efe7d6;
    --crema: #faf6ee;
    --lienzo: #fffcf5;
    --crema-2: #f3ecdd;
    --espresso: #241a12;
    --espresso-2: #4e3d2f;
    --humo: #74604e;
    --terracota: #b65327;
    --terracota-2: #9c4318;
    --terracota-tinte: #f6e3d7;
    --bosque: #33523b;
    --bosque-tinte: #e9efe6;
    --oro: #6e5316;
    --oro-tinte: #f2e7ce;
    --linea: #e8dfcc;
  }
  /* La app Cafeto es cálida y clara por decisión de marca; solo el fondo
     alrededor del teléfono se adapta al tema del visor. */
  @media (prefers-color-scheme: dark) { :root { --fondo: #17100a; } }
  :root[data-theme="dark"] { --fondo: #17100a; }
  :root[data-theme="light"] { --fondo: #efe7d6; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 1.2rem;
  }
  .telefono {
    width: 100%; max-width: 405px; height: 92vh; height: 92dvh; max-height: 860px;
    background: var(--crema); color: var(--espresso);
    border-radius: 2.4rem; overflow: hidden; position: relative;
    box-shadow: 0 2px 6px rgba(20,12,6,.18), 0 30px 80px rgba(20,12,6,.35);
    display: flex; flex-direction: column;
  }
  @media (max-width: 560px) {
    body { padding: 0; }
    .telefono { max-width: none; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
  }

  h1, h2, h3, .serif { font-family: "Fraunces", "Iowan Old Style", Georgia, serif; letter-spacing: -0.015em; }

  .cabeza {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1.15rem 0.7rem; flex: none;
  }
  .marca { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.25rem; display: flex; align-items: baseline; gap: 0.35rem; }
  .marca::after { content: ""; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--terracota); }
  .chip-demo { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--oro); background: var(--oro-tinte); border-radius: 999px; padding: 0.25rem 0.6rem; }

  main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0.2rem 1.15rem 1.4rem; scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }

  .tabs {
    flex: none; display: grid; grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid var(--linea); background: var(--lienzo);
    padding: 0.35rem 0.3rem calc(0.45rem + env(safe-area-inset-bottom));
  }
  .tab {
    appearance: none; background: none; border: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 0.18rem;
    font: inherit; font-size: 0.62rem; font-weight: 600; color: var(--humo);
    padding: 0.35rem 0; border-radius: 0.8rem;
  }
  .tab svg { width: 1.25rem; height: 1.25rem; }
  .tab.activa { color: var(--terracota-2); }
  .tab:focus-visible { outline: 2px solid var(--terracota); outline-offset: 2px; }

  button { font: inherit; }
  .btn {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px;
    padding: 0.8rem 1.3rem; font-weight: 600; font-size: 0.92rem;
    display: inline-flex; align-items: center; gap: 0.45rem; justify-content: center;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .btn svg { width: 1rem; height: 1rem; }
  .btn-primario { background: var(--terracota); color: #fff; }
  .btn-primario:hover { background: var(--terracota-2); }
  .btn-oscuro { background: var(--espresso); color: var(--crema); }
  .btn-borde { background: var(--lienzo); color: var(--espresso); border: 1px solid rgba(36,26,18,0.2); }
  .btn-borde:hover { border-color: var(--terracota); color: var(--terracota-2); }
  .btn-borde.activo-verde { background: var(--bosque); border-color: var(--bosque); color: var(--crema); }
  .btn-borde.activo-terra { background: var(--terracota); border-color: var(--terracota); color: #fff; }
  .btn:focus-visible, .chip:focus-visible, .tarjeta-cafe:focus-visible { outline: 2px solid var(--terracota); outline-offset: 2px; }

  .fila-chips { display: flex; gap: 0.45rem; overflow-x: auto; padding: 0.15rem 1.15rem 0.5rem; margin: 0 -1.15rem; scrollbar-width: none; }
  .fila-chips::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none; border: 0; cursor: pointer; white-space: nowrap;
    border-radius: 999px; padding: 0.5rem 0.9rem; font-size: 0.8rem; font-weight: 600;
    background: var(--crema-2); color: var(--espresso-2); transition: background 0.2s, color 0.2s;
  }
  .chip:hover { background: var(--linea); }
  .chip.activa { background: var(--espresso); color: var(--crema); }

  .foto {
    position: relative; border-radius: 1.3rem; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: rgba(36,26,18,0.28);
  }
  .foto svg { width: 2rem; height: 2rem; }
  .foto .insignia-nuevo { position: absolute; left: 0.55rem; top: 0.55rem; background: rgba(242,231,206,0.95); color: var(--oro); font-size: 0.62rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 999px; }
  .btn-fav {
    position: absolute; right: 0.5rem; top: 0.5rem; width: 2.2rem; height: 2.2rem;
    border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: rgba(36,26,18,0.35); color: #fff; backdrop-filter: blur(4px); transition: background 0.2s, transform 0.1s;
  }
  .btn-fav:active { transform: scale(0.88); }
  .btn-fav.activo { background: var(--lienzo); color: var(--terracota); }
  .btn-fav svg { width: 1.05rem; height: 1.05rem; }

  .saludo h1 { font-size: 1.7rem; line-height: 1.12; margin: 0.4rem 0 0.3rem; text-wrap: balance; }
  .saludo p { margin: 0 0 1rem; color: var(--espresso-2); font-size: 0.92rem; }
  .zona-pin { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--bosque); font-size: 0.78rem; font-weight: 600; margin-top: 0.6rem; }
  .zona-pin svg { width: 0.85rem; height: 0.85rem; }

  .accesos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 0.9rem 0 1.4rem; }
  .acceso {
    appearance: none; border: 1px solid var(--linea); background: var(--lienzo); cursor: pointer;
    border-radius: 1.1rem; padding: 0.7rem 0.4rem; display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    font-size: 0.7rem; font-weight: 600; color: var(--espresso-2);
  }
  .acceso svg { width: 1.15rem; height: 1.15rem; color: var(--terracota-2); }

  .seccion-titulo { font-size: 1.18rem; margin: 1.3rem 0 0.1rem; }
  .seccion-bajada { font-size: 0.82rem; color: var(--humo); margin: 0 0 0.7rem; }
  .fila-cafes { display: flex; gap: 0.7rem; overflow-x: auto; margin: 0 -1.15rem; padding: 0.1rem 1.15rem 0.6rem; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .fila-cafes::-webkit-scrollbar { display: none; }
  .fila-cafes .tarjeta-cafe { width: 9.6rem; flex: none; scroll-snap-align: start; }

  .tarjeta-cafe { position: relative; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; border-radius: 1.3rem; }
  .tarjeta-cafe .foto { aspect-ratio: 4 / 5; }
  .tarjeta-cafe .nombre { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 0.95rem; margin: 0.5rem 0 0.05rem; display: flex; justify-content: space-between; gap: 0.5rem; }
  .tarjeta-cafe .nombre .precio { color: var(--humo); font-family: "Instrument Sans", sans-serif; font-size: 0.78rem; font-weight: 500; }
  .tarjeta-cafe .zona { font-size: 0.76rem; color: var(--humo); }
  .cuadricula { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem 0.7rem; }

  .volver { display: inline-flex; align-items: center; gap: 0.2rem; border: 0; background: var(--crema-2); color: var(--espresso); cursor: pointer; border-radius: 999px; padding: 0.5rem 0.9rem 0.5rem 0.6rem; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.8rem; }
  .volver svg { width: 0.95rem; height: 0.95rem; }

  .perfil-hero { aspect-ratio: 16 / 11; margin-bottom: 0.9rem; }
  .perfil h1 { font-size: 1.55rem; margin: 0.15rem 0 0.5rem; }
  .perfil .frase { font-family: "Fraunces", Georgia, serif; font-size: 1.02rem; color: var(--espresso); margin: 0 0 0.6rem; }
  .perfil .descripcion { font-size: 0.88rem; color: var(--espresso-2); line-height: 1.6; margin: 0 0 1rem; }
  .mini-titulo { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.13em; color: var(--terracota-2); margin: 1.1rem 0 0.45rem; }
  .lista-conocido { list-style: none; margin: 0; padding: 0; }
  .lista-conocido li { display: flex; gap: 0.5rem; align-items: flex-start; font-size: 0.86rem; color: var(--espresso-2); margin-bottom: 0.4rem; }
  .lista-conocido svg { width: 0.9rem; height: 0.9rem; color: var(--terracota); flex: none; margin-top: 0.15rem; }
  .amenidades { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .amenidad { background: var(--bosque-tinte); color: var(--bosque); font-size: 0.74rem; font-weight: 600; border-radius: 999px; padding: 0.35rem 0.7rem; }
  .horario-fila { display: flex; justify-content: space-between; font-size: 0.84rem; padding: 0.3rem 0; border-bottom: 1px dashed var(--linea); }
  .horario-fila:last-child { border-bottom: 0; }
  .horario-fila span:first-child { color: var(--humo); }
  .acciones-perfil { display: flex; gap: 0.5rem; margin-top: 1.1rem; }
  .acciones-perfil .btn { flex: 1; padding: 0.75rem 0.5rem; font-size: 0.84rem; }

  .escenario { border: 2px dashed var(--linea); background: rgba(255,252,245,0.6); border-radius: 1.5rem; aspect-ratio: 4 / 3.4; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1rem; }
  .escenario svg { width: 2.2rem; height: 2.2rem; color: var(--terracota); }
  .escenario .grande { font-family: "Fraunces", Georgia, serif; font-size: 1.15rem; font-weight: 600; margin-top: 0.6rem; }
  .escenario .nota { font-size: 0.8rem; color: var(--humo); margin-top: 0.2rem; }
  .resultado { background: var(--lienzo); border: 1px solid var(--linea); border-radius: 1.5rem; overflow: hidden; box-shadow: 0 14px 40px rgba(36,26,18,0.12); }
  .resultado .foto { border-radius: 0; aspect-ratio: 16 / 10; }
  .resultado .cuerpo { padding: 0.9rem 1.1rem 1.2rem; text-align: center; }
  .resultado .hoy-toca { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--terracota-2); }
  .resultado h2 { font-size: 1.5rem; margin: 0.25rem 0 0.1rem; }
  .resultado .zona { font-size: 0.8rem; color: var(--humo); }
  .resultado .frase { font-size: 0.85rem; color: var(--espresso-2); margin: 0.5rem 0 0.9rem; }
  .girar-zona { display: flex; justify-content: center; margin-top: 1.1rem; }
  @keyframes asentar { from { opacity: 0.4; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .asentar { animation: asentar 0.28s ease-out; }
  @media (prefers-reduced-motion: reduce) { .asentar { animation: none; } }

  .tarjeta-ruta { display: block; width: 100%; border: 1px solid var(--linea); background: var(--lienzo); cursor: pointer; text-align: left; font: inherit; color: inherit; padding: 0; border-radius: 1.4rem; overflow: hidden; margin-bottom: 0.9rem; }
  .tarjeta-ruta .foto { border-radius: 0; aspect-ratio: 16 / 9; }
  .tarjeta-ruta .cuerpo { padding: 0.85rem 1.05rem 1rem; }
  .tarjeta-ruta h3 { margin: 0 0 0.15rem; font-size: 1.08rem; }
  .tarjeta-ruta p { margin: 0 0 0.5rem; font-size: 0.82rem; color: var(--espresso-2); }
  .meta-ruta { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; font-size: 0.72rem; font-weight: 600; color: var(--humo); }
  .meta-ruta span { display: inline-flex; align-items: center; gap: 0.28rem; }
  .meta-ruta svg { width: 0.8rem; height: 0.8rem; }

  .progreso-caja { display: flex; align-items: center; gap: 0.8rem; background: var(--lienzo); border: 1px solid var(--linea); border-radius: 1.1rem; padding: 0.75rem 1rem; margin: 0.9rem 0 1.1rem; font-size: 0.82rem; color: var(--espresso-2); }
  .barra { flex: 1; height: 0.45rem; background: var(--crema-2); border-radius: 999px; overflow: hidden; }
  .barra > div { height: 100%; background: var(--terracota); border-radius: 999px; transition: width 0.4s; }
  .barra.verde > div { background: var(--bosque); }

  .parada { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem; margin-bottom: 0.4rem; }
  .parada .col-num { display: flex; flex-direction: column; align-items: center; }
  .num-circulo { width: 2.1rem; height: 2.1rem; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "Fraunces", Georgia, serif; font-weight: 600; background: var(--terracota-tinte); color: var(--terracota-2); }
  .num-circulo.hecha { background: var(--bosque); color: var(--crema); }
  .num-circulo svg { width: 1rem; height: 1rem; }
  .hilo { width: 1px; flex: 1; background: var(--linea); margin: 0.2rem 0; }
  .parada .contenido { padding-bottom: 1.1rem; min-width: 0; }
  .parada .momento { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--humo); padding-top: 0.4rem; }
  .parada-tarjeta { display: flex; align-items: center; gap: 0.6rem; background: var(--lienzo); border: 1px solid var(--linea); border-radius: 1rem; padding: 0.55rem; margin-top: 0.45rem; }
  .parada-tarjeta .foto { width: 3.2rem; height: 3.2rem; flex: none; border-radius: 0.8rem; }
  .parada-tarjeta .foto svg { width: 1.2rem; height: 1.2rem; }
  .parada-tarjeta .info { flex: 1; min-width: 0; }
  .parada-tarjeta .info button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 0.95rem; color: inherit; }
  .parada-tarjeta .info .z { font-size: 0.74rem; color: var(--humo); }
  .btn-paso { border: 1px solid rgba(36,26,18,0.2); background: none; cursor: pointer; border-radius: 999px; padding: 0.45rem 0.75rem; font-size: 0.74rem; font-weight: 600; color: var(--espresso); white-space: nowrap; }
  .btn-paso.hecha { background: var(--bosque); border-color: var(--bosque); color: var(--crema); }
  .parada .tip { font-size: 0.8rem; font-style: italic; color: var(--espresso-2); margin: 0.45rem 0 0; }

  .tiles-retos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
  .tile-reto { background: var(--lienzo); border: 1px solid var(--linea); border-radius: 1.1rem; padding: 0.65rem 0.4rem; text-align: center; }
  .tile-reto .v { font-family: "Fraunces", Georgia, serif; font-size: 1.45rem; font-weight: 600; }
  .tile-reto .e { font-size: 0.62rem; font-weight: 600; color: var(--humo); }
  .tarjeta-reto { background: var(--lienzo); border: 1px solid var(--linea); border-radius: 1.3rem; padding: 1rem 1.05rem; margin-bottom: 0.8rem; }
  .tarjeta-reto.logrado { background: var(--bosque-tinte); border-color: rgba(51,82,59,0.3); }
  .tarjeta-reto .fila-arriba { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.55rem; }
  .icono-reto { width: 2.4rem; height: 2.4rem; border-radius: 0.85rem; background: var(--oro-tinte); color: var(--oro); display: flex; align-items: center; justify-content: center; }
  .icono-reto.logrado { background: var(--bosque); color: var(--crema); }
  .icono-reto svg { width: 1.2rem; height: 1.2rem; }
  .insignia-lograda { font-size: 0.66rem; font-weight: 700; background: var(--bosque); color: var(--crema); border-radius: 999px; padding: 0.3rem 0.6rem; }
  .tarjeta-reto h3 { margin: 0 0 0.15rem; font-size: 1rem; }
  .tarjeta-reto .d { font-size: 0.8rem; color: var(--espresso-2); margin: 0 0 0.7rem; }
  .fila-progreso { display: flex; align-items: center; gap: 0.6rem; font-size: 0.74rem; font-weight: 600; color: var(--humo); }

  .vacio { border: 2px dashed var(--linea); border-radius: 1.5rem; padding: 2.4rem 1.4rem; text-align: center; }
  .vacio .circ { width: 3rem; height: 3rem; border-radius: 50%; background: var(--terracota-tinte); color: var(--terracota-2); display: inline-flex; align-items: center; justify-content: center; }
  .vacio .circ svg { width: 1.3rem; height: 1.3rem; }
  .vacio h2 { font-size: 1.2rem; margin: 0.7rem 0 0.25rem; }
  .vacio p { font-size: 0.85rem; color: var(--espresso-2); margin: 0 0 1rem; }

  .pie-demo { margin-top: 1.6rem; padding-top: 0.9rem; border-top: 1px solid var(--linea); font-size: 0.7rem; color: var(--humo); line-height: 1.5; }
</style>

<div class="telefono">
  <header class="cabeza">
    <span class="marca">Cafeto</span>
    <span class="chip-demo" id="titulo-vista">Demo portátil</span>
  </header>
  <main id="vista" tabindex="-1"></main>
  <nav class="tabs" aria-label="Navegación principal" id="tabs"></nav>
</div>

  const chipsMood = [chip(S.rMood === null, "rmood", 'data-m=""', "Sorpréndeme")]

    escenario = `<div class="resultado">${foto(c, "", false)}
      <div class="cuerpo"><h2>${c.n}</h2><div class="zona">${c.z}</div></div></div>`;
  } else {
    escenario = `<div class="escenario">${I.dado}
      <div class="grande">${candidatos.length} ${candidatos.length === 1 ? "café en juego" : "cafés en juego"}</div>
      <p class="nota">Gira y deja que el azar tenga buen gusto.</p></div>`;
  }
  return `

      <button class="btn btn-oscuro" data-a="girar" ${S.rFase === "girando" ? "disabled" : ""}>
        ${S.rFase === "resultado" ? I.refrescar + " Girar otra vez" : I.dado + " Girar la ruleta"}</button></div>` : ""}`;
}

function girar(){
  const candidatos = CAFES.filter(c =>
    (S.rMood === null || c.m.includes(S.rMood)) && (S.rSector === null || c.sec === S.rSector));
  if (!candidatos.length) return;
  temporizadores.forEach(clearTimeout); temporizadores = [];
  const alAzar = (excepto) => {
    const opciones = candidatos.length > 1 && excepto ? candidatos.filter(c => c !== excepto) : candidatos;
    return opciones[Math.floor(Math.random() * opciones.length)];
  };
  const eleccion = alAzar(S.rActual);
  if (menosMovimiento || candidatos.length === 1) {
    S.rActual = eleccion; S.rFase = "resultado"; render(false); return;
  }
  S.rFase = "girando";
  const pasos = [0, 110, 230, 360, 510, 690, 910, 1180, 1480];
  pasos.forEach((espera, i) => {
    temporizadores.push(setTimeout(() => {
      if (i < pasos.length - 1) { S.rActual = alAzar(S.rActual); }
      else { S.rActual = eleccion; S.rFase = "resultado"; }
      render(false);
    }, espera));
  });
}

    <p>Itinerarios cortos y curados: a qué hora llegar y qué pedir.</p></div>
    ${RUTAS.map(r => `
      <button class="tarjeta-ruta" data-a="ver-ruta" data-s="${r.s}">
        <div class="foto" style="background:${FONDOS[r.g]};border-radius:0">${I.taza}</div>
        <div class="cuerpo">
          <h3>${r.t}</h3><p>${r.b}</p>
          <div class="meta-ruta">
            <span>${I.pin} ${r.z}</span><span>${I.reloj} ${r.dur}</span><span>${I.huella} ${r.p.length} paradas</span>
          </div>
        </div>
      </button>`).join("")}`;
}

function vRuta(){
  const r = RUTAS.find(x => x.s === S.ruta); if (!r) { S.vista = "rutas"; return vRutas(); }
  const hechas = leer(K.r).filter(p => p.startsWith(r.s + "/")).map(p => p.slice(r.s.length + 1));
  const completa = hechas.length === r.p.length;
  return `
    <button class="volver" data-a="ir" data-v="rutas">${I.atras} Rutas</button>
    <div class="foto" style="background:${FONDOS[r.g]};aspect-ratio:16/9">${I.taza}</div>
    <div class="saludo"><h1 style="font-size:1.45rem">${r.t}</h1><p>${r.b}</p></div>
    <div class="meta-ruta" style="margin-top:-0.4rem">
      <span>${I.pin} ${r.z}</span><span>${I.reloj} ${r.dur}</span>
    </div>
    <div class="progreso-caja">
      ${completa ? `<span style="color:var(--bosque);font-weight:700">Ruta completada. Nada mal, ¿eh?</span>`
        : `<span><strong class="serif" style="font-size:1.2rem">${hechas.length}</strong> de ${r.p.length} paradas</span>`}
      <div class="barra ${completa ? "verde" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="${r.p.length}" aria-valuenow="${hechas.length}" aria-label="Progreso de la ruta">
        <div style="width:${(hechas.length / r.p.length) * 100}%"></div>
      </div>
    </div>
    ${r.p.map(([slug, momento, tip], i) => {
      const c = cafeDe(slug); const hecha = hechas.includes(slug); const ultima = i === r.p.length - 1;
      return `<div class="parada">
        <div class="col-num">
          <span class="num-circulo ${hecha ? "hecha" : ""}">${hecha ? I.check : i + 1}</span>
          ${ultima ? "" : '<span class="hilo"></span>'}
        </div>
        <div class="contenido">
          <div class="momento">${momento}</div>
          <div class="parada-tarjeta">
            <div class="foto" style="background:${FONDOS[c.g]}">${I.taza}</div>
            <div class="info">
              <button data-a="ver-cafe" data-s="${c.s}" data-desde="ruta">${c.n}</button>
              <div class="z">${c.z}</div>
            </div>
            <button class="btn-paso ${hecha ? "hecha" : ""}" data-a="paso" data-r="${r.s}" data-s="${slug}" aria-pressed="${hecha}">
              ${hecha ? "Hecha" : "Marcar"}</button>
          </div>
          <p class="tip">${tip}</p>
        </div>
      </div>`;
    }).join("")}`;
}

function progresoReto(reto){
  const favs = leer(K.f), visitas = leer(K.v);
  if (reto.tipo === "favoritos") return Math.min(favs.length, reto.meta);
  if (reto.tipo === "visitas") return Math.min(visitas.length, reto.meta);
  return (reto.cafes || []).filter(s => visitas.includes(s)).length;
}

function vRetos(){
  const favs = leer(K.f), visitas = leer(K.v);
  const logrados = RETOS.filter(r => progresoReto(r) >= r.meta).length;
  return `
    <div class="saludo"><h1>Tu ciudad, taza por taza</h1>
    <p>Retos cortos para conocer más cafés, a tu ritmo. Marca tus visitas con “Ya fui” en cada perfil.</p></div>
    <div class="tiles-retos">
      <div class="tile-reto"><div class="v">${visitas.length}</div><div class="e">visitados</div></div>
      <div class="tile-reto"><div class="v">${favs.length}</div><div class="e">guardados</div></div>
      <div class="tile-reto"><div class="v">${logrados}</div><div class="e">retos logrados</div></div>
    </div>
    ${RETOS.map(r => {
      const p = progresoReto(r); const ok = p >= r.meta;
      return `<div class="tarjeta-reto ${ok ? "logrado" : ""}">
        <div class="fila-arriba">
          <span class="icono-reto ${ok ? "logrado" : ""}">${I[r.ic]}</span>
          ${ok ? `<span class="insignia-lograda">Insignia: ${r.ins}</span>` : ""}
        </div>
        <h3>${r.t}</h3><p class="d">${r.d}</p>
        <div class="fila-progreso">
          <div class="barra ${ok ? "verde" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="${r.meta}" aria-valuenow="${p}" aria-label="${r.t}">
            <div style="width:${(p / r.meta) * 100}%"></div>
          </div>
          <span>${p} de ${r.meta}</span>
        </div>
      </div>`;
    }).join("")}`;
}

function vGuardados(){
  const guardados = CAFES.filter(c => leer(K.f).includes(c.s));
  if (!guardados.length) return `
    <div class="saludo"><h1>Los tuyos</h1><p>Los cafés que quieres recordar, recomendar o repetir.</p></div>
    <div class="vacio">
      <span class="circ">${I.marcador}</span>
      <h2>Aún no guardas ningún café</h2>
      <p>Cuando encuentres uno que te enamore, tócale el marcador y aquí te estará esperando.</p>
      <button class="btn btn-primario" data-a="ir" data-v="descubre">Explorar cafés</button>
    </div>`;
  return `
    <div class="saludo"><h1>Los tuyos</h1>
    <p>${guardados.length === 1 ? "Un café guardado. Buen comienzo." : guardados.length + " cafés guardados. Tu propio mapa de la ciudad."}</p></div>
    <div class="cuadricula">${guardados.map(c => tarjetaCafe(c, "guardados")).join("")}</div>`;
}

/* ============ Render y eventos ============ */
const VISTAS = { descubre: vDescubre, cafe: vCafe, ruleta: vRuleta, rutas: vRutas, ruta: vRuta, retos: vRetos, guardados: vGuardados };
const TABS = [
  ["descubre", "Descubre", "brujula"], ["ruleta", "Ruleta", "dado"], ["rutas", "Rutas", "mapa"],
  ["retos", "Retos", "premio"], ["guardados", "Guardados", "marcador"],
];
const TITULOS = { descubre:"Demo portátil", cafe:"Perfil", ruleta:"Ruleta de café", rutas:"Rutas", ruta:"Ruta", retos:"Retos", guardados:"Guardados" };
const principal = document.getElementById("vista");
const barraTabs = document.getElementById("tabs");

function render(subir = true){
  principal.innerHTML = VISTAS[S.vista]();
  document.getElementById("titulo-vista").textContent = TITULOS[S.vista] || "Cafeto";
  const tabActiva = S.vista === "cafe" ? (S.desde === "ruleta" ? "ruleta" : S.desde === "ruta" ? "rutas" : S.desde || "descubre")
    : S.vista === "ruta" ? "rutas" : S.vista;
  barraTabs.innerHTML = TABS.map(([v, tx, ic]) =>
    `<button class="tab ${tabActiva === v ? "activa" : ""}" data-a="ir" data-v="${v}" ${tabActiva === v ? 'aria-current="page"' : ""}>${I[ic]}${tx}</button>`).join("");
  if (subir) principal.scrollTop = 0;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  if (a === "ir") {
    temporizadores.forEach(clearTimeout);
    if (S.rFase === "girando") S.rFase = S.rActual ? "resultado" : "inicio";
    S.vista = el.dataset.v; render();
  }
  else if (a === "ver-cafe") { S.cafe = el.dataset.s; S.desde = el.dataset.desde || "descubre"; S.vista = "cafe"; render(); }
  else if (a === "ver-ruta") { S.ruta = el.dataset.s; S.vista = "ruta"; render(); }
  else if (a === "fav") { alternar(K.f, el.dataset.s); render(false); }
  else if (a === "visita") { alternar(K.v, el.dataset.s); render(false); }
  else if (a === "paso") { alternar(K.r, el.dataset.r + "/" + el.dataset.s); render(false); }
  else if (a === "mood") { S.mood = el.dataset.m; render(false); }
  else if (a === "rmood") { S.rMood = el.dataset.m || null; S.rFase = "inicio"; S.rActual = null; render(false); }
  else if (a === "rsector") { S.rSector = el.dataset.z || null; S.rFase = "inicio"; S.rActual = null; render(false); }
  else if (a === "girar") { girar(); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-a]')) {
    e.preventDefault(); e.target.click();
  }
});

render();
</script>

</body>
</html>
