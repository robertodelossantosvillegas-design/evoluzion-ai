<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafeto — App</title>
</head>
<body>
<style>
  :root { --fondo: #efe7d6; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #120c07; } }
  :root[data-theme="dark"] { --fondo: #120c07; }
  :root[data-theme="light"] { --fondo: #efe7d6; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--fondo);
    font-family: "Instrument Sans", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 1.2rem;
  }

  /* ====== Tokens internos del teléfono (mutan por pantalla) ====== */
  .telefono {
    --p-fondo: #f7f1e4;
    --p-sup: #fffcf5;
    --p-sup2: #f0e8d7;
    --p-texto: #241a12;
    --p-texto2: #5b4936;
    --p-humo: #8a755f;
    --p-linea: rgba(60, 42, 26, 0.1);
    --terracota: #b65327;
    --terracota-2: #9c4318;
    --bosque: #33523b;
    --oro: #c9a15a;
    --crema: #f7f1e4;
    --espresso: #241a12;

    width: 100%; max-width: 405px; height: 93vh; height: 93dvh; max-height: 875px;
    background: var(--p-fondo); color: var(--p-texto);
    border-radius: 2.8rem; overflow: hidden; position: relative;
    box-shadow: 0 2px 8px rgba(15, 9, 4, 0.25), 0 40px 90px rgba(15, 9, 4, 0.45), inset 0 0 0 1px rgba(255,255,255,0.06);
    transition: background-color 0.55s ease;
  }
  .telefono[data-v="ruleta"] {
    --p-fondo: #1a110a;
    --p-sup: #241811;
    --p-sup2: #2e2015;
    --p-texto: #f4ead9;
    --p-texto2: #cbb59d;
    --p-humo: #9b8570;
    --p-linea: rgba(244, 234, 217, 0.1);
  }
  @media (max-width: 560px) {
    body { padding: 0; }
    .telefono { max-width: none; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
    .barra-estado { display: none; }
  }

  h1, h2, h3, .serif { font-family: "Fraunces", "Iowan Old Style", Georgia, serif; letter-spacing: -0.02em; }

  /* ====== Barra de estado simulada ====== */
  .barra-estado {
    position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.85rem 1.7rem 0; font-size: 0.78rem; font-weight: 700;
    color: var(--p-texto); pointer-events: none; transition: color 0.55s ease;
    font-variant-numeric: tabular-nums;
  }
  .telefono[data-v="cafe"] .barra-estado { color: #fff; }
  .barra-estado svg { width: 1rem; height: 1rem; display: block; }
  .barra-estado .grupo { display: flex; gap: 0.3rem; align-items: center; }

  main {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    padding: 3.1rem 0 7.5rem; scrollbar-width: none;
  }
  main::-webkit-scrollbar { display: none; }
  .telefono[data-v="cafe"] main { padding-top: 0; }
  .lado { padding-left: 1.3rem; padding-right: 1.3rem; }

  @keyframes entrar { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .vista-anim { animation: entrar 0.32s cubic-bezier(0.2, 0.7, 0.2, 1); }
  @media (prefers-reduced-motion: reduce) { .vista-anim { animation: none; } * { transition-duration: 0.01ms !important; } }

  /* ====== Barra inferior flotante de vidrio ====== */
  .dock {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(1rem + env(safe-area-inset-bottom));
    z-index: 40; display: flex; gap: 0.2rem; align-items: center;
    background: rgba(255, 252, 245, 0.78);
    -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(60, 42, 26, 0.08);
    border-radius: 999px; padding: 0.35rem;
    box-shadow: 0 10px 34px rgba(24, 14, 6, 0.22), 0 1px 2px rgba(24, 14, 6, 0.08);
    transition: background-color 0.55s ease, border-color 0.55s ease;
  }
  .telefono[data-v="ruleta"] .dock {
    background: rgba(36, 24, 17, 0.72); border-color: rgba(244, 234, 217, 0.1);
  }
  .tab {
    appearance: none; background: none; border: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 0.14rem;
    font: inherit; font-size: 0.56rem; font-weight: 700; letter-spacing: 0.02em;
    color: var(--p-humo); width: 3.6rem; padding: 0.5rem 0 0.42rem;
    border-radius: 999px; transition: color 0.25s, background-color 0.25s, transform 0.12s;
  }
  .tab:active { transform: scale(0.9); }
  .tab svg { width: 1.35rem; height: 1.35rem; }
  .tab.activa { color: var(--terracota); background: rgba(182, 83, 39, 0.12); }
  .telefono[data-v="ruleta"] .tab.activa { color: var(--oro); background: rgba(201, 161, 90, 0.14); }
  .tab:focus-visible { outline: 2px solid var(--terracota); outline-offset: 2px; }

  /* ====== Botones y chips ====== */
  button { font: inherit; }
  .btn {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px;
    padding: 0.95rem 1.5rem; font-weight: 700; font-size: 0.95rem;
    display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center;
    transition: transform 0.12s, filter 0.2s; letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.96); }
  .btn svg { width: 1.05rem; height: 1.05rem; }
  .btn-primario { background: var(--terracota); color: #fff; box-shadow: 0 10px 26px rgba(182, 83, 39, 0.4); }
  .btn-primario:hover { filter: brightness(1.06); }
  .btn-fantasma { background: var(--p-sup2); color: var(--p-texto); }
  .btn:focus-visible, .chip:focus-visible, .heroe:focus-visible, .celda:focus-visible { outline: 2px solid var(--terracota); outline-offset: 2px; }

  .fila-chips { display: flex; gap: 0.45rem; overflow-x: auto; padding: 0.2rem 1.3rem 0.6rem; scrollbar-width: none; }
  .fila-chips::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none; border: 1px solid var(--p-linea); cursor: pointer; white-space: nowrap;
    border-radius: 999px; padding: 0.58rem 1rem; font-size: 0.8rem; font-weight: 600;
    background: var(--p-sup); color: var(--p-texto2);
    transition: background-color 0.22s, color 0.22s, border-color 0.22s, transform 0.12s;
  }
  .chip:active { transform: scale(0.94); }
  .chip.activa { background: var(--espresso); color: var(--crema); border-color: var(--espresso); }
  .telefono[data-v="ruleta"] .chip.activa { background: var(--oro); color: #241811; border-color: var(--oro); }

  /* ====== Cabecera de app ====== */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem 1.3rem 0.2rem;
  }
  .marca { font-family: "Fraunces", Georgia, serif; font-weight: 650; font-size: 1.32rem; display: flex; align-items: baseline; gap: 0.32rem; }
  .marca::after { content: ""; width: 0.42rem; height: 0.42rem; border-radius: 50%; background: var(--terracota); }
  .pin-ciudad {
    display: inline-flex; align-items: center; gap: 0.35rem;
    background: var(--p-sup); border: 1px solid var(--p-linea);
    border-radius: 999px; padding: 0.42rem 0.85rem; font-size: 0.74rem; font-weight: 700; color: var(--p-texto2);
  }
  .pin-ciudad svg { width: 0.85rem; height: 0.85rem; color: var(--terracota); }

  .titulo-pantalla { font-size: 1.85rem; line-height: 1.08; margin: 0.7rem 0 0.25rem; text-wrap: balance; }
  .bajada-pantalla { margin: 0 0 1.1rem; color: var(--p-texto2); font-size: 0.9rem; line-height: 1.45; }

  /* ====== Buscador visual ====== */
  .buscador {
    display: flex; align-items: center; gap: 0.6rem; width: calc(100% - 2.6rem);
    margin: 0.75rem 1.3rem 0.2rem; border: 1px solid var(--p-linea); cursor: pointer;
    background: var(--p-sup); color: var(--p-humo); font: inherit; font-size: 0.88rem;
    border-radius: 999px; padding: 0.85rem 1.1rem; text-align: left;
    box-shadow: 0 5px 16px rgba(24,14,6,0.06); transition: transform 0.12s;
  }
  .buscador:active { transform: scale(0.98); }
  .buscador svg { width: 1.05rem; height: 1.05rem; color: var(--terracota); flex: none; }

  /* ====== Círculos de rumbos ====== */
  .zonas { display: flex; gap: 0.9rem; overflow-x: auto; padding: 0.55rem 1.3rem 0.4rem; scrollbar-width: none; }
  .zonas::-webkit-scrollbar { display: none; }
  .zona-circ {
    appearance: none; border: 0; background: none; cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
    width: 4rem; flex: none; padding: 0; transition: transform 0.12s;
  }
  .zona-circ:active { transform: scale(0.92); }
  .zona-circ .circ {
    width: 3.7rem; height: 3.7rem; border-radius: 50%; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", Georgia, serif; font-weight: 650; font-size: 0.98rem; letter-spacing: 0.04em; color: #fff;
    box-shadow: 0 6px 16px rgba(24,14,6,0.18), inset 0 0 0 2px rgba(255,251,242,0.35);
    text-shadow: 0 1px 6px rgba(0,0,0,0.35);
  }
  .zona-circ .circ::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 30% 25%, rgba(255,255,255,0.32), transparent 60%); }
  .zona-circ .nom { font-size: 0.62rem; font-weight: 700; color: var(--p-texto2); line-height: 1.15; text-align: center; }
  .zona-circ .cant { font-size: 0.56rem; font-weight: 700; color: var(--p-humo); margin-top: -0.2rem; }
  .zona-circ.prox .circ { background: var(--p-sup2) !important; color: var(--p-humo); box-shadow: inset 0 0 0 2px var(--p-linea); text-shadow: none; }
  .zona-circ.prox .circ::after { display: none; }
  .zona-circ.prox .nom { color: var(--p-humo); }

  /* ====== Tarjeta destacada compacta ====== */
  .destacada { display: block; width: calc(100% - 2.6rem); margin: 0.3rem 1.3rem 0; cursor: pointer; text-align: left; }
  .destacada .foto { aspect-ratio: 16 / 9.6; border-radius: 1.6rem; box-shadow: 0 14px 32px rgba(24,14,6,0.18); }
  .destacada .foto .contenido { padding: 1rem 1.1rem; }
  .destacada .foto .contenido .eti { font-size: 0.58rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--oro); }
  .destacada .foto .contenido .n { font-size: 1.35rem; margin-top: 0.12rem; }

  /* ====== Fotos (gradientes con material) ====== */
  .foto {
    position: relative; overflow: hidden; border-radius: 1.5rem;
    display: flex; align-items: center; justify-content: center;
    isolation: isolate;
  }
  .foto::before {
    content: ""; position: absolute; inset: -30%;
    background:
      radial-gradient(60% 50% at 25% 20%, rgba(255,255,255,0.4), transparent 60%),
      radial-gradient(50% 45% at 80% 85%, rgba(30,15,5,0.28), transparent 65%);
    z-index: 1;
  }
  .foto .marca-agua { position: absolute; z-index: 1; width: 34%; height: 34%; color: rgba(36,26,18,0.16); }
  .foto .velo {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, rgba(20,11,4,0.02) 42%, rgba(20,11,4,0.62) 100%);
  }
  .foto .contenido {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 0.9rem 1rem; color: #fff;
  }
  .foto .contenido .n { font-family: "Fraunces", Georgia, serif; font-weight: 650; font-size: 1.06rem; line-height: 1.15; text-shadow: 0 1px 8px rgba(0,0,0,0.3); }
  .foto .contenido .z { font-size: 0.72rem; font-weight: 600; color: rgba(255,251,242,0.85); margin-top: 0.15rem; display: flex; align-items: center; gap: 0.55rem; }
  .foto .contenido .z span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .foto .contenido .z .pts { color: var(--oro); font-weight: 700; }
  .insignia-nuevo {
    position: absolute; left: 0.7rem; top: 0.7rem; z-index: 3;
    background: rgba(255, 250, 238, 0.92); color: #8a6117;
    font-size: 0.6rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.28rem 0.6rem; border-radius: 999px;
  }
  .btn-fav {
    position: absolute; right: 0.65rem; top: 0.65rem; z-index: 4;
    width: 2.35rem; height: 2.35rem; border-radius: 50%; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(24, 14, 6, 0.38); color: #fff;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transition: background-color 0.2s, transform 0.12s;
  }
  .btn-fav:active { transform: scale(0.84); }
  .btn-fav.activo { background: rgba(255, 252, 245, 0.95); color: var(--terracota); }
  .btn-fav svg { width: 1.05rem; height: 1.05rem; }

  .seccion { display: flex; align-items: baseline; justify-content: space-between; padding: 1.25rem 1.3rem 0.55rem; }
  .seccion h2 { font-size: 1.08rem; margin: 0; }
  .seccion .sub { font-size: 0.68rem; font-weight: 700; color: var(--p-humo); letter-spacing: 0.04em; }

  .carril { display: flex; gap: 0.65rem; overflow-x: auto; padding: 0.1rem 1.3rem 0.45rem; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .carril::-webkit-scrollbar { display: none; }
  .carril .celda { flex: 0 0 8.5rem; scroll-snap-align: start; }
  .carril .celda .foto .contenido { padding: 0.7rem 0.75rem; }
  .carril .celda .foto .contenido .n { font-size: 0.92rem; }

  .celda { position: relative; cursor: pointer; border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; }
  .celda .foto { aspect-ratio: 4 / 4.9; }
  .cuadricula { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; padding: 0 1.3rem; }

  /* ====== Perfil (hoja sobre hero) ====== */
  .perfil-hero { position: relative; height: 46vh; min-height: 300px; max-height: 400px; border-radius: 0; }
  .perfil-hero .velo { background: linear-gradient(180deg, rgba(20,11,4,0.34) 0%, rgba(20,11,4,0) 32%, rgba(20,11,4,0.25) 100%); }
  .btn-flotante {
    position: absolute; top: 3.2rem; z-index: 5;
    width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(24,14,6,0.4); color: #fff;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: transform 0.12s;
  }
  .btn-flotante:active { transform: scale(0.88); }
  .btn-flotante svg { width: 1.15rem; height: 1.15rem; }
  .btn-flotante.izq { left: 1rem; }
  .btn-flotante.der { right: 1rem; }
  .btn-flotante.der.activo { background: rgba(255,252,245,0.95); color: var(--terracota); }

  .hoja {
    position: relative; z-index: 6; margin-top: -1.9rem;
    background: var(--p-fondo); border-radius: 1.9rem 1.9rem 0 0;
    padding: 1.5rem 1.3rem 1rem; min-height: 40vh;
  }
  .hoja::before { content: ""; position: absolute; top: 0.55rem; left: 50%; transform: translateX(-50%); width: 2.4rem; height: 0.28rem; border-radius: 999px; background: var(--p-linea); }
  .hoja h1 { font-size: 1.75rem; margin: 0.2rem 0 0.2rem; }
  .fila-datos { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.7rem 0 1rem; }
  .dato { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--p-sup); border: 1px solid var(--p-linea); border-radius: 999px; padding: 0.42rem 0.8rem; font-size: 0.74rem; font-weight: 700; color: var(--p-texto2); }
  .dato svg { width: 0.85rem; height: 0.85rem; color: var(--terracota); }
  .frase-perfil { font-family: "Fraunces", Georgia, serif; font-size: 1.12rem; line-height: 1.35; margin: 0 0 0.6rem; }
  .desc-perfil { font-size: 0.9rem; color: var(--p-texto2); line-height: 1.62; margin: 0 0 1.1rem; }
  .mini-titulo { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--terracota); margin: 1.15rem 0 0.5rem; }
  .telefono[data-v="ruleta"] .mini-titulo { color: var(--oro); }
  .lista-conocido { list-style: none; margin: 0; padding: 0; }
  .lista-conocido li { display: flex; gap: 0.55rem; align-items: flex-start; font-size: 0.88rem; color: var(--p-texto2); margin-bottom: 0.45rem; }
  .lista-conocido svg { width: 0.95rem; height: 0.95rem; color: var(--terracota); flex: none; margin-top: 0.12rem; }
  .amenidades { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .amenidad { background: rgba(51,82,59,0.12); color: var(--bosque); font-size: 0.74rem; font-weight: 700; border-radius: 999px; padding: 0.4rem 0.75rem; }
  .telefono[data-v="ruleta"] .amenidad { background: rgba(143,184,155,0.14); color: #a9c9b4; }
  .horario-fila { display: flex; justify-content: space-between; font-size: 0.86rem; padding: 0.42rem 0; border-bottom: 1px dashed var(--p-linea); }
  .horario-fila:last-child { border-bottom: 0; }
  .horario-fila span:first-child { color: var(--p-humo); }
  .acciones-perfil { display: flex; gap: 0.55rem; margin-top: 1.2rem; }
  .acciones-perfil .btn { flex: 1; padding: 0.9rem 0.4rem; font-size: 0.86rem; }
  .btn-fantasma.activo-verde { background: var(--bosque); color: #f0f5ef; }

  /* ====== RULETA (rueda real) ====== */
  .escena-ruleta { text-align: center; }
  .rueda-caja { position: relative; width: min(78vw, 300px); margin: 1.1rem auto 0; }
  .rueda-caja::before {
    content: ""; position: absolute; inset: -14%;
    background: radial-gradient(closest-side, rgba(201,161,90,0.18), transparent 72%);
    z-index: 0; pointer-events: none;
  }
  .rueda-svg { position: relative; z-index: 1; display: block; width: 100%; height: auto; filter: drop-shadow(0 18px 34px rgba(0,0,0,0.45)); }
  #g-rueda { transform-origin: 150px 150px; }
  #g-rueda.girando { transition: transform 3.4s cubic-bezier(0.12, 0.72, 0.1, 1); }
  .seg-txt { font-family: "Fraunces", Georgia, serif; font-weight: 650; font-size: 21px; fill: rgba(255, 250, 238, 0.95); }
  .puntero {
    position: absolute; top: -0.55rem; left: 50%; transform: translateX(-50%); z-index: 3;
    width: 0; height: 0; border-left: 0.72rem solid transparent; border-right: 0.72rem solid transparent;
    border-top: 1.15rem solid var(--oro);
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.45));
  }
  .hub {
    position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 30%; aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 32% 28%, #3a2818, #1c1108 78%);
    color: var(--oro); font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 0.92rem;
    letter-spacing: 0.14em; box-shadow: 0 0 0 5px rgba(201,161,90,0.55), 0 8px 22px rgba(0,0,0,0.5);
    transition: transform 0.12s;
  }
  .hub:active { transform: translate(-50%, -50%) scale(0.93); }
  .hub:disabled { cursor: default; opacity: 0.85; }
  .leyenda-rueda { margin: 1.1rem auto 0; max-width: 17rem; font-size: 0.8rem; color: var(--p-humo); line-height: 1.5; }

  /* ====== Hoja de resultado (bottom sheet) ====== */
  .telon {
    position: absolute; inset: 0; z-index: 45; background: rgba(10, 5, 2, 0.55);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity 0.3s; border: 0; padding: 0;
  }
  .telon.abierto { opacity: 1; pointer-events: auto; }
  .hoja-resultado {
    position: absolute; left: 0.6rem; right: 0.6rem; bottom: 0.6rem; z-index: 46;
    background: var(--p-sup); color: var(--p-texto);
    border-radius: 2rem; overflow: hidden;
    transform: translateY(115%); transition: transform 0.42s cubic-bezier(0.2, 0.9, 0.25, 1.02);
    box-shadow: 0 -10px 50px rgba(0,0,0,0.4);
  }
  .hoja-resultado.abierta { transform: translateY(0); }
  .hoja-resultado .foto { border-radius: 0; aspect-ratio: 16 / 8.5; }
  .hoja-resultado .cuerpo { padding: 1rem 1.25rem 1.25rem; text-align: center; }
  .hoja-resultado .hoy-toca { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--oro); }
  .hoja-resultado h2 { font-size: 1.7rem; margin: 0.25rem 0 0.05rem; }
  .hoja-resultado .z { font-size: 0.8rem; color: var(--p-humo); }
  .hoja-resultado .f { font-size: 0.86rem; color: var(--p-texto2); margin: 0.5rem 0 1rem; line-height: 1.5; }
  .hoja-resultado .botones { display: flex; gap: 0.55rem; }
  .hoja-resultado .botones .btn { flex: 1; font-size: 0.88rem; padding: 0.9rem 0.4rem; }

function candidatosRuleta(){

function segmentosSVG(cands){
  const n = cands.length;
  const cx = 150, cy = 150, r = 144;
  if (n === 1) {
    return `<circle cx="150" cy="150" r="${r}" fill="${COLORES_RUEDA[0]}" stroke="#120b06" stroke-width="3"/>
      <text class="seg-txt" x="150" y="86" text-anchor="middle">${cands[0].n.slice(0,1)}</text>`;
  }
  const seg = 360 / n;
  let s = "";
  for (let i = 0; i < n; i++) {
    const a0 = (-90 + i * seg) * Math.PI / 180;
    const a1 = (-90 + (i + 1) * seg) * Math.PI / 180;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const grande = seg > 180 ? 1 : 0;
    s += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${grande} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z"
      fill="${COLORES_RUEDA[i % COLORES_RUEDA.length]}" stroke="#120b06" stroke-width="2.5"/>`;
    const am = (-90 + i * seg + seg / 2) * Math.PI / 180;
    const tx = cx + r * 0.68 * Math.cos(am), ty = cy + r * 0.68 * Math.sin(am);
    const rot = (-90 + i * seg + seg / 2) + 90;
    s += `<text class="seg-txt" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
      transform="rotate(${rot.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})">${cands[i].n.slice(0, 1)}</text>`;
  }
  return s;
}
function vRuleta(){

  return `

function girarRueda(){
  const cands = ruedaCandidatos;
  if (!cands.length || girando) return;
  const w = Math.floor(Math.random() * cands.length);
  const ganador = cands[w];
  if (menosMovimiento || cands.length === 1) { abrirResultado(ganador); return; }
  girando = true;
  const hub = document.getElementById("hub");
  if (hub) { hub.disabled = true; hub.textContent = "…"; }
  const g = document.getElementById("g-rueda");
  const seg = 360 / cands.length;
  const centroGanador = w * seg + seg / 2;
  const vueltas = 5 + Math.floor(Math.random() * 2);
  const desvio = (Math.random() - 0.5) * seg * 0.5;
  const destino = anguloRueda + 360 * vueltas + ((360 - centroGanador - (anguloRueda % 360) + 720) % 360) + desvio;
  g.classList.add("girando");
  requestAnimationFrame(() => { g.style.transform = `rotate(${destino}deg)`; });
  const alTerminar = () => {
    g.removeEventListener("transitionend", alTerminar);
    anguloRueda = destino % 360;
    girando = false;
    abrirResultado(ganador);
  };
  g.addEventListener("transitionend", alTerminar);
  setTimeout(() => { if (girando) alTerminar(); }, 3900); /* red de seguridad */
}

  const hoja = document.getElementById("hoja-resultado");
  hoja.innerHTML = `
    <div class="cuerpo" style="text-align:left;padding-top:1.2rem">
      <div class="hoy-toca" style="text-align:center">Check-in</div>
      <h2 style="font-size:1.25rem;text-align:center;margin-bottom:0.7rem">¿Dónde andas?</h2>
      <div style="max-height:16rem;overflow-y:auto;display:flex;flex-direction:column;gap:0.4rem">
        ${CAFES.map(c => `
          <button class="parada-tarjeta" style="width:100%;cursor:pointer;border:1px solid var(--p-linea);background:var(--p-sup2)" data-a="checkin" data-s="${c.s}">
            <span class="foto" style="background:${FONDOS[c.g]};width:2.6rem;height:2.6rem;border-radius:0.75rem"></span>
            <span class="info" style="text-align:left"><span style="font-family:Fraunces,Georgia,serif;font-weight:650">${c.n}</span><br><span class="z" style="font-size:0.72rem;color:var(--p-humo)">${c.z}</span></span>
          </button>`).join("")}
      </div>
    </div>`;
  document.getElementById("telon").classList.add("abierto");
  hoja.classList.add("abierta");
}
function hacerCheckin(slug){
  const c = cafeDe(slug);
  const mios = leer(K.p);
  mios.unshift({ id: "u" + Date.now(), tipo: "checkin", quien: "Tú", g: 2, cafe: slug, hace: "ahora", texto: "", antojos: 0 });
  escribir(K.p, mios.slice(0, 20));
  cerrarResultado();
  S.comuSeg = "actividad"; S.vista = "comunidad"; render();
}

/* ====== Escáner QR (demo): sella la visita ====== */
function abrirEscaner(slug){
  const c = cafeDe(slug);
  const hoja = document.getElementById("hoja-resultado");
  hoja.innerHTML = `
    <div class="escaner">
      <div class="hoy-toca">QR de la mesa</div>
      <div class="visor"><span class="laser"></span></div>
      <h2>Escaneando…</h2>
      <p>Apunta al código Cafeto de ${c.n}.</p>
    </div>`;
  document.getElementById("telon").classList.add("abierto");
  hoja.classList.add("abierta");
  setTimeout(() => {
    const sellos = leer(K.q);
    if (!sellos.includes(slug)) escribir(K.q, [...sellos, slug]);
    const visitas = leer(K.v);
    if (!visitas.includes(slug)) escribir(K.v, [...visitas, slug]);
    const mios = leer(K.p);
    mios.unshift({ id: "u" + Date.now(), tipo: "checkin", quien: "Tú", g: 2, cafe: slug, hace: "ahora", sello: true, texto: "", antojos: 0 });
    escribir(K.p, mios.slice(0, 20));
    hoja.innerHTML = `
      <div class="escaner">
        <div class="hoy-toca">¡Listo!</div>
        <span class="sello-logrado"><span class="ab">${c.n.split(" ").map(w => w[0]).join("").slice(0, 2)}</span><span class="mini">Sello</span></span>
        <h2>Sello de ${c.n}</h2>
        <p>Tu visita quedó registrada: cuenta para tus retos y tu pasaporte.</p>
        <div style="display:flex;gap:0.55rem;margin-top:1rem">
          <button class="btn btn-fantasma" style="flex:1" data-a="cerrar-hoja">Cerrar</button>
          <button class="btn btn-primario" style="flex:1" data-a="ir-pasaporte">Ver pasaporte</button>
        </div>
      </div>`;
  }, menosMovimiento ? 300 : 1700);
}

function vRetos(){
  const favs = leer(K.f), visitas = leer(K.v);
  const logrados = RETOS.filter(r => progresoReto(r) >= r.meta).length;
  return `
    <div class="top">
      <span class="marca">Cafeto</span>
      <span class="pin-ciudad">${I.premio} ${logrados} de ${RETOS.length}</span>
    </div>
    <div class="lado">
      <h1 class="titulo-pantalla">Tu ciudad, taza por taza</h1>
      <p class="bajada-pantalla">Marca tus visitas con "Ya fui" en cada perfil; aquí se cuentan solas.</p>
    </div>
    <div class="tiles-retos">
      <div class="tile-reto"><div class="v">${visitas.length}</div><div class="e">visitados</div></div>
      <div class="tile-reto"><div class="v">${favs.length}</div><div class="e">guardados</div></div>
      <div class="tile-reto"><div class="v">${logrados}</div><div class="e">insignias</div></div>
    </div>
    ${RETOS.map(r => {
      const p = progresoReto(r); const ok = p >= r.meta;
      return `<div class="tarjeta-reto ${ok ? "logrado" : ""}">
        ${anillo(p, r.meta, ok, r.ic)}
        <div class="cuerpo-r">
          <h3>${r.t}</h3><p class="d">${r.d}</p>
          <div class="estado">${ok ? "Insignia: " + r.ins + " ✓" : p + " de " + r.meta}</div>
        </div>
      </div>`;
    }).join("")}`;
}

function vGuardados(){
  const guardados = CAFES.filter(c => leer(K.f).includes(c.s));
  const cuerpo = !guardados.length ? `
    <div class="vacio">
      <span class="circ">${I.marcador}</span>
      <h2>Aún no guardas ningún café</h2>
      <p>Cuando encuentres uno que te enamore, tócale el marcador y aquí te estará esperando.</p>
      <button class="btn btn-primario" data-a="ir" data-v="descubre">Explorar cafés</button>
    </div>`
    : `<div class="cuadricula">${guardados.map(c => celda(c, "guardados")).join("")}</div>`;
  return `
    <div class="top">
      <span class="marca">Cafeto</span>
      <span class="pin-ciudad">${I.marcador} ${guardados.length}</span>
    </div>
    <div class="lado">
      <h1 class="titulo-pantalla">Los tuyos</h1>
      <p class="bajada-pantalla">${guardados.length ? "Tu propio mapa de la ciudad." : "Los cafés que quieres recordar, recomendar o repetir."}</p>
    </div>
    ${cuerpo}`;
}

/* ============ Render y eventos ============ */
const VISTAS = { descubre: vDescubre, zona: vZona, cafe: vCafe, ruleta: vRuleta, mapa: vMapa, ruta: vRuta, comunidad: vComunidad, retos: vRetos, guardados: vGuardados };
const TABS = [
  ["descubre", "Descubre", "brujula"], ["mapa", "Mapa", "mapa"], ["ruleta", "Ruleta", "rueda"],
  ["comunidad", "Comunidad", "usuarios"], ["guardados", "Guardados", "marcador"],
];
const principal = document.getElementById("vista");
const barraTabs = document.getElementById("tabs");
const telefono = document.getElementById("telefono");

function render(subir = true, animar = true){
  telefono.dataset.v = S.vista;
  principal.innerHTML = `<div class="${animar ? "vista-anim" : ""}">${VISTAS[S.vista]()}</div>`;
  const tabActiva = S.vista === "cafe"
    ? ({ ruleta:"ruleta", ruta:"mapa", mapa:"mapa", comunidad:"comunidad", guardados:"guardados" }[S.desde] || "descubre")
    : S.vista === "ruta" ? "mapa" : S.vista === "zona" ? "descubre" : S.vista === "retos" ? "comunidad" : S.vista;
  barraTabs.innerHTML = TABS.map(([v, tx, ic]) =>
    `<button class="tab ${tabActiva === v ? "activa" : ""}" data-a="ir" data-v="${v}" ${tabActiva === v ? 'aria-current="page"' : ""}>${I[ic]}${tx}</button>`).join("");
  if (subir) principal.scrollTop = 0;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (el) {
    const a = el.dataset.a;
    if (a === "ir") { cerrarResultado(); girando = false; S.vista = el.dataset.v; render(); }
    else if (a === "ver-zona") { S.zona = el.dataset.z; S.vista = "zona"; render(); }
    else if (a === "ir-todos") { const t = document.getElementById("todos"); if (t) t.scrollIntoView({ behavior: menosMovimiento ? "auto" : "smooth" }); }
    else if (a === "ver-cafe") { cerrarResultado(); S.cafe = el.dataset.s; S.desde = el.dataset.desde || "descubre"; S.vista = "cafe"; render(); }
    else if (a === "ver-ruta") { S.ruta = el.dataset.s; S.vista = "ruta"; render(); }
    else if (a === "fav") { alternar(K.f, el.dataset.s); render(false, false); }
    else if (a === "visita") { alternar(K.v, el.dataset.s); render(false, false); }
    else if (a === "paso") { alternar(K.r, el.dataset.r + "/" + el.dataset.s); render(false, false); }
    else if (a === "mood") { S.mood = el.dataset.m; render(false, false); }
    else if (a === "rmood") { S.rMood = el.dataset.m || null; anguloRueda = 0; render(false, false); }
    else if (a === "rsector") { S.rSector = el.dataset.z || null; anguloRueda = 0; render(false, false); }
    else if (a === "girar") { girarRueda(); }
    else if (a === "regirar") { cerrarResultado(); setTimeout(girarRueda, menosMovimiento ? 0 : 320); }
    else if (a === "pin") { S.pin = S.pin === el.dataset.s ? null : el.dataset.s; render(false, false); }
    else if (a === "ruta-mapa") { S.rutaMapa = el.dataset.r || null; S.pin = null; render(false, false); }
    else if (a === "comu-seg") { S.comuSeg = el.dataset.g; render(false, false); }
    else if (a === "antojo") { alternar(K.a, el.dataset.p); render(false, false); }
    else if (a === "abrir-checkin") { abrirCheckin(); }
    else if (a === "checkin") { hacerCheckin(el.dataset.s); }
    else if (a === "escanear") { abrirEscaner(el.dataset.s); }
    else if (a === "cerrar-hoja") { cerrarResultado(); render(false, false); }
    else if (a === "ir-pasaporte") { cerrarResultado(); S.comuSeg = "retos"; S.vista = "comunidad"; render(); }
    return;
  }
  if (e.target.id === "telon") cerrarResultado();
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-a]')) {
    e.preventDefault(); e.target.click();
  }
  if (e.key === "Escape") cerrarResultado();
});

render();
</script>

</body>
</html>
